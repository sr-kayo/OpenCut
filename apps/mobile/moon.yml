$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

tasks:
  dev:
    command: 'bun run start'
    options:
      runInCI: false

  android:
    command: 'bun run android'
    options:
      runInCI: false

  typecheck:
    command: 'bun run typecheck'
    inputs:
      - 'src/**/*'
      - 'app.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'

  lint:
    command: 'bun run lint'
    inputs:
      - 'src/**/*'
      - 'eslint.config.js'
      - 'package.json'
      - 'bun.lock'

  test:
    command: 'bun run test'
    inputs:
      - 'src/**/*'
      - 'jest.setup.ts'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'

  doctor:
    command: 'bun run doctor'
    options:
      runInCI: false

  preview:
    command: 'bun run build:preview'
    inputs:
      - 'src/**/*'
      - 'assets/**/*'
      - 'app.json'
      - 'package.json'
      - 'bun.lock'
    outputs:
      - 'android/app/build/outputs/apk/release/app-release.apk'
    options:
      runInCI: false
